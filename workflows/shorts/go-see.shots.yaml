  across a golden-hour tropical rooftop terrace. Unmarked sun-washed teal
  running-coat sleeves with faint circuit-thread seams and matching gloves
  occupy the lower third, left glove pumping through the lower-left. Warm
  gold-cyan holographic glyph motes bloom at the wrists. A compact unmarked
  data-staff is slung across the back. Unmarked palms and glass towers rush
  toward a bright bay; a rooftop gap sits in the center distance. Wide 24mm
  body-cam, slight barrel, framed for YouTube 16:9. Clean unmarked surfaces,
  empty of lettering.
