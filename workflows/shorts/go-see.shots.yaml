identity_look: |
  A photoreal first-person still at cool dawn. An olive windbreaker and a matching pair of worn black gloves occupy the lower edges of the frame, hands pumping as wet tar rooftops and unmarked brick bulkheads fill the view. Blue-gold first light, a few pigeons mid-scatter over the next roof. Eye-level body-cam on a 24mm lens, framed for YouTube 16:9. Clean unmarked surfaces, empty of lettering.
