# Strong-types gate for first-party **production** Python. Read together with
# mypy-tests.ini (the pytest tree), pyrightconfig.json, and
# tests/python/test_strong_types.py, which parses the per-module sections
# below as the single list of declared type boundaries.
#
# The rule: no broad types. `Any` is a declared boundary, never a convenience,
# so `disallow_any_explicit` is on by default and only the sections at the
# bottom opt out - each one is a real third-party boundary with a stated
# reason. Add a section only when the value genuinely comes from a library
# this repo cannot type; `object`, a `TypedDict`, or a `TYPE_CHECKING` alias
# of the real class is the answer everywhere else.
#
# tests/python is checked by mypy-tests.ini instead: mypy per-module patterns
# only accept a wildcard as a whole dotted component, so the test tree cannot
# be exempted from inside this file, and its fakes earn a looser bar.
#
# Docs page: docs/contribute/typing.md

[mypy]
python_version = 3.12
files = custom_nodes, docker, docs, scripts/lib, studio-ui, tools
mypy_path = custom_nodes, docker, docker/pythonpath, scripts/lib, studio-ui, tests/python, docs, tools
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
exclude = (?x)(^|/)(site|coverage|\.venv|venv)/

# Every def annotated, nothing inferred.
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

# No bare generics, no silent Any, no lying about what a checker saw.
disallow_any_generics = True
disallow_any_explicit = True
disallow_subclassing_any = True
warn_return_any = True
warn_unreachable = True
warn_unused_ignores = True
enable_error_code = ignore-without-code

# Value semantics the repo already relies on.
strict_equality = True
extra_checks = True

# Comfy's INPUT_TYPES registry mixes str/int/bool/combo-lists per widget and
# tests index sections that a node omits, so the payload stays an open map.
# See the rationale in ez_common/protocols.py.
[mypy-ez_common.protocols]
disallow_any_explicit = False

# The torch / numpy alias block: np.ndarray is generic, and spelling its
# parameters is the only way to keep this alias portable across hosts that do
# and do not have numpy installed.
[mypy-ez_common.tensors]
disallow_any_explicit = False

# Interpreter-start import hook: it receives third-party module objects and
# torch enum members it must not import eagerly. `docker/pythonpath` is a
# mypy_path root, so this module's name is its bare stem.
[mypy-sitecustomize]
disallow_any_explicit = False

# bpy attribute chains are Blender-version dependent and bpy is not installed
# here, so a structural Protocol would assert more than the code can prove.
# `tools` is a mypy_path root, so these carry `blender.` and not `tools.blender.`.
[mypy-blender.*]
disallow_any_explicit = False

# ---------------------------------------------------------------------------
# DEBT: not boundaries. Each section below is first-party code that still
# carries `dict[str, Any]` where a TypedDict or the ez_common.json_value
# vocabulary would be the honest type. They are here so the gate can be green
# *today* while the residue stays visible, and they are policed by
# tests/python/test_strong_types.py: the module count, the per-module `Any`
# count, and the production-wide `Any` total may all fall and none may rise.
# Delete a section the moment its module goes clean - a section whose module
# no longer mentions Any fails the gate.
#
# Do not add to this list without a PR conversation. New code is held to the
# law at the top of this file.
# ---------------------------------------------------------------------------

# DEBT: the dub pipeline drives optional runtime models (qwen-tts, whisper,
# ONNX sessions) whose payloads arrive as untyped dicts from json and from
# injected test hooks.
[mypy-ez_dub.pipeline]
disable_error_code = explicit-any

# DEBT: 16 kHz PCM, VAD windows, and whisper word rows cross into this module
# as untyped numeric lists.
[mypy-ez_dub.speech]
disable_error_code = explicit-any

# DEBT: film jobstore / shot / concat-side state is a JSON document that grew
# key by key; the row shapes need TypedDicts.
[mypy-ez_film.jobstore]
disable_error_code = explicit-any

[mypy-ez_film.shots]
disable_error_code = explicit-any

[mypy-ez_film.nodes]
disable_error_code = explicit-any

[mypy-ez_film.accept]
disable_error_code = explicit-any

[mypy-ez_film.animatic]
disable_error_code = explicit-any

[mypy-ez_film.otio_export]
disable_error_code = explicit-any

[mypy-ez_film.overlay]
disable_error_code = explicit-any

[mypy-ez_film.stems]
disable_error_code = explicit-any

# DEBT: forge and quality nodes take Comfy widget payloads, which are open
# maps until the node registry types them.
[mypy-ez_studio_forge.pipeline]
disable_error_code = explicit-any

[mypy-ez_studio_forge.nodes]
disable_error_code = explicit-any

[mypy-ez_quality.routes]
disable_error_code = explicit-any

[mypy-ez_quality.nodes]
disable_error_code = explicit-any

# DEBT: torch + torchvision segmentation outputs (masks, logits, weights
# enums) are untyped here and torch is not installed in the hermetic lane.
[mypy-ez_image.person_mask]
disable_error_code = explicit-any

# DEBT: prompt-enhance packs hand model outputs (audio tensors, cinema
# catalog rows) around as parsed JSON.
[mypy-ez_prompt_enhance.cinema]
disable_error_code = explicit-any

[mypy-ez_prompt_enhance.audio]
disable_error_code = explicit-any

# DEBT: docs generators read JSON/YAML catalogs from disk; the row dicts want
# the ez_common.json_value vocabulary plus a TypedDict per catalog.
[mypy-generate_workflow_docs]
disable_error_code = explicit-any

[mypy-generate_cinema_docs]
disable_error_code = explicit-any

[mypy-generate_audio_docs]
disable_error_code = explicit-any

[mypy-cinema_clip_prompts]
disable_error_code = explicit-any

[mypy-commands]
