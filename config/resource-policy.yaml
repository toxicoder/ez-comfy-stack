# Purpose:
#   Human-readable resource and headroom policy for the unified us-safe-studio
#   Visual Generative AI stack on a single DGX Spark (GB10). Consumed by operators
#   and mirrored by manage.sh defaults (MIN_HOST_FREE_GIB, MEM_LIMIT, model tiers).
# Source of truth: this file
# Regenerate: n/a
# Safety:
#   Headroom values leave free unified memory for OS and remote SSH while the
#   ComfyUI container is limited near 90g. Do not lower min_host_free_gib without
#   measuring SSH stability under load.
#
version: 1

hardware:
  name: dgx-spark-gb10
  unified_memory_gib: 128
  gpus: 1

# Minimum free host memory (GiB) required before starting ComfyUI.
# Leaves room for OS, Docker daemon, and interactive SSH.
headroom:
  min_host_free_gib: 28
  min_disk_free_gib: 40

stack:
  id: studio
  label: Unified US-safe studio (Klein 4B + Wan 2.2 + LTX)
  heavy: true
  gpus: 1
  memory_limit: 90g
  memory_reservation: 80g
  cpu: "12"
  models:
    image_tier: fast
    wan_tier: 5b
    ltx_tier: "2.5"
  ports:
    comfyui: 8188

# Default download-models pack (image fast + wan 5b + ltx 2.5).
# Optional fallbacks (zimage, wan a14b, ltx 2.3) are not listed here.
models:
  image_fast:
    repos:
      - black-forest-labs/FLUX.2-klein-4b-fp8
      - Comfy-Org/z_image_turbo # qwen_3_4b TE
      - Comfy-Org/flux2-dev # flux2-vae
    min_gb: 3
  wan_5b:
    repos:
      - Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    min_gb: 12
  ltx_2_5:
    repos:
      - Lightricks/LTX-2.5
    # Selective distilled INT8-convrot + Gemma4-with-proj + VAEs
    min_gb: 30
  llm:
    repos:
      - unsloth/Qwen3-4B-Instruct-2507-GGUF
    # Q4_K_M GGUF only (prompt enhance)
    min_gb: 3
