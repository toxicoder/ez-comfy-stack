name: Deploy Documentation

# Publish Fumadocs static exports to gh-pages.
# - main       → /latest/
# - development → /development/
#
# URL compatibility: the MkDocs site published under those aliases via mike.
# Each alias is its own Next export with matching basePath.
#
# PR docs validation stays in ci.yml. This workflow runs only on push to
# long-lived branches (or workflow_dispatch).
on:
  push:
    branches: [main, development]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "includes/**"
      - "docs/requirements.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "false"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs site dependencies
        run: (cd docs-site && npm ci --legacy-peer-deps)

      - name: Stamp docs publish time
        run: echo "EZ_DOCS_PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and assemble the Pages tree
        env:
          EZ_DOCS_VERSION: ${{ github.ref_name == 'development' && 'development' || 'latest' }}
        run: |
          set -euo pipefail
          root="$(pwd)"
          rm -rf _site
          mkdir -p _site/latest _site/development

          bazelisk run //docs-site:build-latest
          cp -r docs-site/out/. _site/latest/

          bazelisk run //docs-site:build-development
          cp -r docs-site/out/. _site/development/

          touch _site/.nojekyll

          cat >_site/index.html <<'HOR'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="index, follow" />
              <link rel="canonical" href="https://toxicoder.github.io/ez-comfy-stack/latest/" />
              <meta http-equiv="refresh" content="0; url=https://toxicoder.github.io/ez-comfy-stack/latest/" />
              <title>ez-comfy-stack documentation</title>
            </head>
            <body>
              <p>
                The documentation moved. <a href="https://toxicoder.github.io/ez-comfy-stack/latest/">Continue to the latest docs</a>
                &mdash; or read the <a href="https://toxicoder.github.io/ez-comfy-stack/development/">development branch docs</a>.
              </p>
            </body>
          </html>
          HOR

      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC_SHA=$(git rev-parse HEAD)
          git fetch origin gh-pages
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf --quiet . 2>/dev/null || true
          cp -r _site/. ./
          rm -rf _site
          cat >.gitignore <<'GITIGNORE'
          /*
          !/latest
          !/development
          !/index.html
          !/.nojekyll
          GITIGNORE
          git add -A
          git commit -m "docs: publish $GITHUB_REF_NAME from $GITHUB_SHA" --allow-empty
          git push origin gh-pages
          git checkout -f "$SRC_SHA"

      - name: Report the published URLs
        run: |
          {
            echo "## Documentation published"
            echo ""
            echo "| Version | URL |"
            echo "| --- | --- |"
            echo "| latest | https://toxicoder.github.io/ez-comfy-stack/latest/ |"
            echo "| development | https://toxicoder.github.io/ez-comfy-stack/development/ |"
          } >> "$GITHUB_STEP_SUMMARY"
