name: Deploy Documentation

# Publish Fumadocs static exports to gh-pages.
# - main       → /latest/
# - development → /development/
#
# Each run builds ONE alias (the branch that triggered it) and keeps the other
# alias from the current gh-pages tree. Two full Next exports of ~650 pages
# OOM the 7 GB GitHub-hosted runner (shutdown signal during the second compile).
#
# URL compatibility: the MkDocs site published under those aliases via mike.
# A root index.html forwards bare /ez-comfy-stack/ traffic to /latest/.
#
# PR docs validation stays in ci.yml. This workflow runs only on push to
# long-lived branches (or workflow_dispatch).
on:
  push:
    branches: [main, development]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "includes/**"
      - "docs/requirements.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "false"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs site dependencies
        run: (cd docs-site && npm ci --legacy-peer-deps)

      - name: Stamp docs publish time
        run: echo "EZ_DOCS_PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and assemble the Pages tree
        env:
          EZ_DOCS_VERSION: ${{ github.ref_name == 'development' && 'development' || 'latest' }}
          DOCS_ALIAS: ${{ github.ref_name == 'development' && 'development' || 'latest' }}
        run: |
          set -euo pipefail
          alias="${DOCS_ALIAS}"
          case "${alias}" in
            latest | development) ;;
            *)
              echo "deploy-docs: DOCS_ALIAS must be latest or development, got ${alias}" >&2
              exit 1
              ;;
          esac

          rm -rf _site
          mkdir -p _site

          # Keep the other mike-compatible alias from the live Pages tree.
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages latest development 2>/dev/null | tar -x -C _site || true
          fi

          mkdir -p docs-site/public
          if [[ -d docs/assets ]]; then
            rm -rf docs-site/public/assets
            cp -R docs/assets docs-site/public/assets
          fi

          rm -rf "_site/${alias}"
          mkdir -p "_site/${alias}"
          bazelisk run "//docs-site:build-${alias}"
          cp -r docs-site/out/. "_site/${alias}/"

          touch _site/.nojekyll
          cp docs-site/pages-root-index.html _site/index.html

      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC_SHA=$(git rev-parse HEAD)
          git fetch origin gh-pages
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf --quiet . 2>/dev/null || true
          cp -r _site/. ./
          rm -rf _site
          cat >.gitignore <<'GITIGNORE'
          /*
          !/latest
          !/development
          !/index.html
          !/.nojekyll
          GITIGNORE
          git add -A
          git commit -m "docs: publish $GITHUB_REF_NAME from $GITHUB_SHA" --allow-empty
          git push origin gh-pages
          git checkout -f "$SRC_SHA"

      - name: Report the published URLs
        run: |
          {
            echo "## Documentation published"
            echo ""
            echo "| Version | URL |"
            echo "| --- | --- |"
            echo "| latest | https://toxicoder.github.io/ez-comfy-stack/latest/ |"
            echo "| development | https://toxicoder.github.io/ez-comfy-stack/development/ |"
          } >> "$GITHUB_STEP_SUMMARY"
