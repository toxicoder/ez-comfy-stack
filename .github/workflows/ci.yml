name: ci

on:
  push:
    branches: [development, main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache shfmt
        id: cache-shfmt
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/shfmt
          key: shfmt-v3.8.0-linux-amd64

      - name: Install shellcheck + shfmt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          if [[ ! -x /usr/local/bin/shfmt ]]; then
            curl -sSL "https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64" -o /tmp/shfmt
            sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          fi

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    env:
      BATS_JOBS: "4"
      LAB_HERMETIC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          # bats + GNU parallel for bats --jobs; shellcheck not needed here
          sudo apt-get install -y bats parallel
          pip install pytest pytest-cov

      - name: Coverage gate
        run: make coverage

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Docs
        env:
          # Suppress Material MkDocs 2.0 advisory; pins stay on mkdocs 1.x.
          NO_MKDOCS_2_WARNING: "1"
        run: make docs
