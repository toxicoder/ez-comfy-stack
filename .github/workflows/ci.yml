name: ci

on:
  push:
    branches: [development, main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          pip install pytest pytest-cov mkdocs-material
          # shfmt
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /tmp/shfmt
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
      - name: Lint
        run: make lint
      - name: Coverage gate
        run: make coverage
      - name: Docs
        run: make docs
