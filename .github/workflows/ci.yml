name: ci

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bazel-core: ${{ steps.filter.outputs.bazel-core }}
      docs: ${{ steps.filter.outputs.docs }}
      ci-graph: ${{ steps.filter.outputs.ci-graph }}
      ci-workflow: ${{ steps.filter.outputs.ci-workflow }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bazel-core:
              - 'scripts/**'
              - 'tests/**'
              - 'lints/**'
              - 'docker/**'
              - 'custom_nodes/**'
              - 'config/**'
              - 'tools/**'
              - 'studio-ui/**'
              - 'workflows/**'
              - 'docs/*.py'
              - 'mypy.ini'
              - 'pyrightconfig.json'
              - '.devcontainer/tool-versions.env'
            docs:
              - 'docs/**'
              - 'docs-site/**'
              - 'includes/**'
              - 'mkdocs.yml'
              - 'scripts/manage.sh'
              - 'scripts/lib/**'
              - 'scripts/utilities/**'
            ci-graph:
              - 'BUILD.bazel'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.bazelrc'
              - '.bazelversion'
              - 'fix.sh'
              - 'scripts/validate.sh'
            ci-workflow:
              - '.github/**'

  bazel-core:
    needs: changes
    if: |
      needs.changes.outputs.bazel-core == 'true' ||
      needs.changes.outputs.ci-graph == 'true' ||
      needs.changes.outputs.ci-workflow == 'true'
    runs-on: ubuntu-latest
    env:
      LAB_HERMETIC: "1"
      EZ_COMFY_PROGRESS: "0"
      HF_PROGRESS: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "true"

      - name: Bazel test (fast core) and lint
        run: |
          bazelisk test //:test-fast --config=ci
          bazelisk test //:lint --config=ci --test_tag_filters=manual

  docs-and-render:
    needs: changes
    if: |
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.ci-graph == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Same cap as deploy-docs.yml. A full Fumadocs export of ~650 pages OOMs
      # the 7 GB GitHub-hosted runner (shutdown signal / exit 143 during next build).
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "false"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs site dependencies
        run: (cd docs-site && npm ci --legacy-peer-deps)

      - name: Docs gates (no browser)
        run: |
          bazelisk test \
            //docs:test_docs_site_render \
            //docs-site:unit \
            //docs-site:typecheck \
            //docs-site:nav_test \
            //docs-site:codemod_test \
            --config=ci

      - name: Docs export
        run: |
          bazelisk run //docs:docs --config=ci
          bazelisk run //docs:render-check --config=ci

  validate-gate:
    needs: [changes, bazel-core, docs-and-render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate gate (path-filter consistency)
        env:
          BAZEL_CORE_RESULT: ${{ needs.bazel-core.result }}
          DOCS_RESULT: ${{ needs.docs-and-render.result }}
          RUN_BAZEL_CORE: ${{ needs.changes.outputs.bazel-core == 'true' || needs.changes.outputs.ci-graph == 'true' || needs.changes.outputs.ci-workflow == 'true' }}
          RUN_DOCS: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci-graph == 'true' }}
        run: bash scripts/ci_check_only.sh
