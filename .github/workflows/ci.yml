name: ci

on:
  push:
    branches: [development, main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bazel-core: ${{ steps.filter.outputs.bazel-core }}
      docs: ${{ steps.filter.outputs.docs }}
      ci-graph: ${{ steps.filter.outputs.ci-graph }}
      ci-workflow: ${{ steps.filter.outputs.ci-workflow }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bazel-core:
              - 'scripts/**'
              - 'tests/**'
              - 'lints/**'
              - 'docker/**'
              - 'custom_nodes/**'
              - 'config/**'
              - 'tools/**'
              - 'studio-ui/**'
              - 'workflows/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'includes/**'
              - 'scripts/manage.sh'
              - 'scripts/lib/**'
              - 'scripts/utilities/**'
            ci-graph:
              - 'BUILD.bazel'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.bazelrc'
              - '.bazelversion'
              - 'fix.sh'
              - 'scripts/validate.sh'
            ci-workflow:
              - '.github/**'

  bazel-core:
    needs: changes
    if: |
      needs.changes.outputs.bazel-core == 'true' ||
      needs.changes.outputs.ci-graph == 'true' ||
      needs.changes.outputs.ci-workflow == 'true'
    runs-on: ubuntu-latest
    env:
      LAB_HERMETIC: "1"
      EZ_COMFY_PROGRESS: "0"
      HF_PROGRESS: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "true"

      - name: Bazel test (fast core) and lint
        run: |
          bazelisk test //:test-fast --config=ci
          bazelisk test //:lint --config=ci --test_tag_filters=manual

      - name: Bazel build of key targets
        run: bazelisk build //:manage //:all --config=ci

  docs-and-render:
    needs: changes
    if: |
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.ci-graph == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            tests/requirements.txt

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "false"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Docs (generate + strict MkDocs)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: bazelisk run //docs:docs --config=ci

  validate-gate:
    needs: [changes, bazel-core, docs-and-render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate gate (path-filter consistency)
        env:
          BAZEL_CORE_RESULT: ${{ needs.bazel-core.result }}
          DOCS_RESULT: ${{ needs.docs-and-render.result }}
          RUN_BAZEL_CORE: ${{ needs.changes.outputs.bazel-core == 'true' || needs.changes.outputs.ci-graph == 'true' || needs.changes.outputs.ci-workflow == 'true' }}
          RUN_DOCS: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci-graph == 'true' }}
        run: bash scripts/ci_check_only.sh
