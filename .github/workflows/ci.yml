name: ci

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bazel-core: ${{ steps.filter.outputs.bazel-core }}
      docs: ${{ steps.filter.outputs.docs }}
      ci-graph: ${{ steps.filter.outputs.ci-graph }}
      ci-workflow: ${{ steps.filter.outputs.ci-workflow }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bazel-core:
              - 'scripts/**'
              - 'tests/**'
              - 'lints/**'
              - 'docker/**'
              - 'custom_nodes/**'
              - 'config/**'
              - 'tools/**'
              - 'studio-ui/**'
              - 'workflows/**'
              - 'schemas/**'
              - 'docs/*.py'
              - 'mypy.ini'
              - 'pyrightconfig.json'
              - '.devcontainer/**'
              - '.vscode/**'
            docs:
              - 'docs/**'
              - 'docs-site/**'
              - 'includes/**'
              - 'scripts/manage.sh'
              - 'scripts/lib/**'
              - 'scripts/utilities/**'
            ci-graph:
              - 'BUILD.bazel'
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '.bazelrc'
              - '.bazelversion'
              - '.bazelignore'
              - 'fix.sh'
              - 'scripts/validate.sh'
            ci-workflow:
              - '.github/**'

  bazel-core:
    needs: changes
    if: |
      needs.changes.outputs.bazel-core == 'true' ||
      needs.changes.outputs.ci-graph == 'true' ||
      needs.changes.outputs.ci-workflow == 'true'
    runs-on: ubuntu-latest
    env:
      LAB_HERMETIC: "1"
      EZ_COMFY_PROGRESS: "0"
      HF_PROGRESS: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "true"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # //lints:* print "<tool> missing - skipping" and still exit 0, so a runner
      # that never installed them goes green having checked nothing. Fail here
      # instead and //:lint keeps meaning something.
      - name: Host toolchain preflight (lint gate trust)
        run: bazelisk run //:setup-host -- --check

      - name: Bazel test (fast core) and lint
        run: |
          bazelisk test //:test-fast --config=ci
          bazelisk test //:lint --config=ci --test_tag_filters=manual

  docs-and-render:
    needs: changes
    if: |
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.ci-graph == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-bazel
        with:
          install-lint-tools: "false"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs site dependencies
        # `run`, not `build`: //docs-site:install is an sh_binary and build would
        # only stage it. The runner cd's into the real docs-site/ tree, so this is
        # the same `npm ci --legacy-peer-deps` the raw step ran.
        run: bazelisk run //docs-site:install

      - name: Cache Next compile
        uses: actions/cache@v5
        with:
          path: docs-site/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('docs-site/package-lock.json', 'docs-site/next.config.ts', 'docs-site/source.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Docs gates (no browser)
        run: |
          bazelisk test \
            //docs:test_docs_site_render \
            //docs-site:unit \
            //docs-site:typecheck \
            //docs-site:nav_test \
            //docs-site:codemod_test \
            --config=ci

      - name: Docs export
        env:
          # Deliberate concession: this build stays raw, Bazel-free.
          # MDX compiles on demand (dynamic: true). bazelisk run keeps a
          # JVM next to Node and 6144 then SIGKILL'd the 7 GB runner. Shut
          # Bazel down and call manage-docs.sh so Next is the only heap.
          NODE_OPTIONS: "--max-old-space-size=5120"
        run: |
          bazelisk shutdown
          ./docs/manage-docs.sh build
          # Same target the no-browser gate above runs. --test_env points it at
          # the real checkout so the export checks read the docs-site/out/ that
          # was just built (in the sandbox they skip), and --nocache stops Bazel
          # answering from the earlier cached pass.
          bazelisk test //docs:test_docs_site_render --config=ci \
            --nocache_test_results \
            --test_env=BUILD_WORKSPACE_DIRECTORY="${GITHUB_WORKSPACE}"

  validate-gate:
    needs: [changes, bazel-core, docs-and-render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate gate (path-filter consistency)
        env:
          BAZEL_CORE_RESULT: ${{ needs.bazel-core.result }}
          DOCS_RESULT: ${{ needs.docs-and-render.result }}
          RUN_BAZEL_CORE: ${{ needs.changes.outputs.bazel-core == 'true' || needs.changes.outputs.ci-graph == 'true' || needs.changes.outputs.ci-workflow == 'true' }}
          RUN_DOCS: ${{ needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci-graph == 'true' }}
        # Deliberate concession: this gate only reads the needs.* context above,
        # so it stays Bazel-free on purpose and never pays a cold start.
        run: bash scripts/ci_check_only.sh
