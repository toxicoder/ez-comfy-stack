# Publish prebuilt ez-comfy image to GitHub Container Registry only.
# Privacy: no HF_TOKEN, no .env, no model weights — public git/pip in Dockerfile only.
#
# Tag matrix (keep in sync with scripts/lib/compose.sh stack_image_tag_for_branch):
#   main (default branch) → us-safe-studio + us-safe-studio-main + sha-*
#   development           → us-safe-studio-development + sha-*
# Operators pull via manage.sh stack_default_image (branch-aligned).
name: publish-image

on:
  push:
    branches: [main, development]
    paths:
      - "docker/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      prebuild:
        description: "Bake Comfy+torch into image (EZ_COMFY_PREBUILD)"
        type: choice
        options: ["1", "0"]
        default: "1"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    # DGX Spark / GB10 — native arm64 (avoid qemu for multi-GB torch)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image metadata (public labels only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ez-comfy
          tags: |
            type=raw,value=us-safe-studio,enable={{is_default_branch}}
            type=raw,value=us-safe-studio-${{ github.ref_name }}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64, GHCR only)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EZ_COMFY_PREBUILD=${{ github.event.inputs.prebuild || '1' }}
            CUDA_BASE_IMAGE=nvidia/cuda:13.0.0-devel-ubuntu24.04
            CUDA_RUNTIME_IMAGE=nvidia/cuda:13.0.0-runtime-ubuntu24.04
            COMFYUI_REF=v0.34.0
            COMFYUI_MANAGER_REF=4.2.2
            COMFYUI_NUNCHAKU_NODE_REF=v1.2.1
            COMFYUI_VHS_REF=
          # Do not pass HF_TOKEN or any host secrets as build-args
          # Pins: ComfyUI v0.34.0 (native Klein 4B + Wan 2.2 + LTX-2.5) + Manager + VHS main
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ez-comfy-arm64
          cache-to: type=gha,mode=max,scope=ez-comfy-arm64
