# Type law for the pytest tree. Companion to mypy.ini, which covers
# production only; tests/typecheck.sh runs both, and pyrightconfig.json
# checks this tree too.
#
# Test doubles fake Comfy graphs, torch tensors, and bpy objects on purpose,
# so `Any` is allowed here: a fake that says "I stand in for a tensor" is
# honest, and banning it would push tests toward asserting less. Everything
# else still bites - full annotations, no bare generics, no silent Any
# returns, no stale ignores - so a test cannot quietly stop checking
# anything.
#
# Docs page: docs/contribute/typing.md

[mypy]
python_version = 3.12
files = tests/python
mypy_path = custom_nodes, docker, docker/pythonpath, scripts/lib, studio-ui, tests/python, docs, tools
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True

check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

disallow_any_generics = True
disallow_subclassing_any = True
warn_return_any = True
warn_unreachable = True
warn_unused_ignores = True
enable_error_code = ignore-without-code

strict_equality = True
extra_checks = True
