site_name: ez-comfy-stack
site_description: Simplified Visual Generative AI (ComfyUI US-safe local studio) for a single NVIDIA DGX Spark
site_url: https://toxicoder.github.io/ez-comfy-stack
repo_url: https://github.com/toxicoder/ez-comfy-stack
# Default edit target; docs/hooks.py on_config stamps this from EZ_DOCS_VERSION
# (development → edit/development/docs/, else edit/main/docs/).
edit_uri: edit/main/docs/

# Multi-version (latest = main, development = development branch) via mike.
# Local single-version builds ignore missing versions.json.
# Branch-aware edit_uri + GitHub source links: docs/hooks.py + EZ_DOCS_VERSION.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

# Sticky header compact-on-scroll. Do not enable header.autohide.
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/glossary.js

# Reload serve when the glossary JSON (outside docs/) changes.
watch:
  - includes

plugins:
  - search

hooks:
  - docs/hooks.py

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Learn:
      - How the studio works: learn/index.md
      - ComfyUI basics: learn/comfyui.md
      - Image and video generation: learn/generation.md
      - Klein, Wan, and LTX: learn/pipeline.md
      - Hardware, memory, and safety: learn/hardware.md
      - Glossary: glossary.md
  - Start:
      - Getting Started: getting-started.md
      - Prompting: prompting.md
      - Model licenses: licenses.md
  - Create:
      - Still to motion to AV: visual-generative-ai.md
      - ComfyUI Apps: studio-apps.md
      - Workflow catalog: studio-workflows.md
      - 90s shorts: shorts.md
      - Local podcast: podcast.md
      - Local music: music.md
      - Studio sidecars: studio-sidecars.md
      - Asset Bible: asset-bible.md
      - Blender GB10 sidecar: blender-gb10-sidecar.md
      - DCC guide pack: dcc-workflows.md
      - Splat sidecar: splat-sidecar.md
  - Operate:
      - manage.sh reference: manage-cli.md
      - Models and cache: models-and-cache.md
      - Download limit: download-limit.md
      - Reboot safety: reboot-safety.md
      - Spark farm: spark-farm.md
      - Troubleshooting: troubleshooting.md
  - Contribute:
      - Conventions: project-conventions.md
