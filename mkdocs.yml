site_name: ez-comfy-stack
site_description: Simplified Visual Generative AI (ComfyUI US-safe local studio) for a single NVIDIA DGX Spark
site_url: https://toxicoder.github.io/ez-comfy-stack
repo_url: https://github.com/toxicoder/ez-comfy-stack
# Default edit target; docs/hooks.py on_config stamps this from EZ_DOCS_VERSION
# (development → edit/development/docs/, else edit/main/docs/).
edit_uri: edit/main/docs/

# Multi-version (latest = main, development = development branch) via mike.
# Local single-version builds ignore missing versions.json.
# Branch-aware edit_uri + GitHub source links: docs/hooks.py + EZ_DOCS_VERSION.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

hooks:
  - docs/hooks.py

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Prompting: prompting.md
  - 90s shorts: shorts.md
  - Visual Generative AI: visual-generative-ai.md
  - Model licenses: licenses.md
  - Spark farm: spark-farm.md
  - Models & Cache: models-and-cache.md
  - Download Limit: download-limit.md
  - Reboot Safety: reboot-safety.md
  - Troubleshooting: troubleshooting.md
  - Conventions: project-conventions.md
