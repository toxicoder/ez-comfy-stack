site_name: ez-comfy-stack
site_description: Simplified Visual Generative AI (ComfyUI US-safe local studio) for a single NVIDIA DGX Spark
site_url: https://toxicoder.github.io/ez-comfy-stack
repo_url: https://github.com/toxicoder/ez-comfy-stack
# Default edit target; docs/hooks.py on_config stamps this from EZ_DOCS_VERSION
# (development → edit/development/docs/, else edit/main/docs/).
edit_uri: edit/main/docs/

# Multi-version (latest = main, development = development branch) via mike.
# Local single-version builds ignore missing versions.json.
# Branch-aware edit_uri + GitHub source links: docs/hooks.py + EZ_DOCS_VERSION.

theme:
  name: material
  font:
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

# Sticky header compact-on-scroll. Do not enable header.autohide.
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/glossary.js
  - javascripts/commands.js
  - javascripts/tables.js
  - javascripts/published.js

# Reload serve when the glossary JSON (outside docs/) changes.
watch:
  - includes

plugins:
  - search

hooks:
  - docs/hooks.py

# Technique clip pages are linked from axis tables; keep them off the nav tree.
not_in_nav: |
  generated/cinema/*/*.md

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

