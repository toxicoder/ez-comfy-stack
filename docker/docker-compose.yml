# Purpose:
#   Docker Compose definition for the unified Visual Generative AI demo on a
#   single NVIDIA DGX Spark: one ComfyUI service configured for Klein 4B stills,
#   Wan 2.2 silent motion, and LTX distilled AV.
# Source of truth: this file (operator entry via scripts/manage.sh)
# Regenerate: n/a
# Safety:
#   - restart: "no" — never auto-start after host reboot (remote SSH safety)
#   - mem_limit / mem_reservation leave host headroom for OS and interactive SSH
#   - host models at MODELS_DIR; generated media at COMFY_OUTPUT_DIR; Comfy install on named volume only
#   - gpus: all (exclusive GPU demo — stop other GPU workloads first)

name: ez-comfy

services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Builder (devel) for optional compile; public Hub by default.
        # Set CUDA_BASE_IMAGE / CUDA_RUNTIME_IMAGE in .env for NGC after docker login nvcr.io
        CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE:-nvidia/cuda:13.0.0-devel-ubuntu24.04}
        CUDA_RUNTIME_IMAGE: ${CUDA_RUNTIME_IMAGE:-nvidia/cuda:13.0.0-runtime-ubuntu24.04}
        # 1 = bake Comfy+torch into image (default). 0 = thin image (cold pip at runtime).
        EZ_COMFY_PREBUILD: ${EZ_COMFY_PREBUILD:-1}
        # Validated pins (see docs/models-and-cache.md). Override to bump or set empty to float.
        COMFYUI_REF: ${COMFYUI_REF:-v0.34.0}
        COMFYUI_MANAGER_REF: ${COMFYUI_MANAGER_REF:-4.2.2}
        COMFYUI_NUNCHAKU_NODE_REF: ${COMFYUI_NUNCHAKU_NODE_REF:-v1.2.1}
        # Empty = VideoHelperSuite main (required for LTX lab VHS_VideoCombine)
        COMFYUI_VHS_REF: ${COMFYUI_VHS_REF:-}
      # Reuse pulled GHCR layers as local build cache when rebuilding
      cache_from:
        - ${EZ_COMFY_IMAGE:-ghcr.io/toxicoder/ez-comfy:us-safe-studio-development}
    # Prefer GHCR prebuilt (arm64). manage.sh sets EZ_COMFY_IMAGE from git branch:
    #   main → :us-safe-studio ; development/feature → :us-safe-studio-development
    # Static fallback matches primary integration branch (development).
    # Never put tokens in this file; HF_TOKEN comes from host env/.env at runtime only.
    image: ${EZ_COMFY_IMAGE:-ghcr.io/toxicoder/ez-comfy:us-safe-studio-development}
    container_name: ez-comfy-studio
    # Manual lifecycle only — operator uses manage.sh start/stop
    restart: "no"
    ports:
      - "${COMFY_PORT:-8188}:8188"
    environment:
      COMFY_HOME: /comfy-state/ComfyUI
      MODELS_ROOT: /models
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      # Runtime only — not baked into image layers
      HF_TOKEN: ${HF_TOKEN:-}
      # On-box prompt-enhance GGUF (CPU llama.cpp). Never bake weights into the image.
      EZ_LLM_GGUF: ${EZ_LLM_GGUF:-/models/comfy/llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      EZ_LLM_N_THREADS: ${EZ_LLM_N_THREADS:-4}
      EZ_LLM_N_CTX: ${EZ_LLM_N_CTX:-4096}
      EZ_LLM_TIMEOUT_S: ${EZ_LLM_TIMEOUT_S:-60}
      EZ_LLM_N_GPU_LAYERS: ${EZ_LLM_N_GPU_LAYERS:-0}
      EZ_LLM_UNLOAD: ${EZ_LLM_UNLOAD:-0}
      LAB_PREBUILT_ROOT: /opt/comfy-prebuilt
      LAB_FORCE_COLD_INSTALL: ${LAB_FORCE_COLD_INSTALL:-0}
      # Runtime pin (must match build-arg). Stamp-present refresh syncs the volume when this changes.
      COMFYUI_REF: ${COMFYUI_REF:-v0.34.0}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      CUDA_MODULE_LOADING: LAZY
      LAB_VISUAL_ENABLE_NVFP4: "1"
      LAB_VISUAL_PROFILE: us-safe-studio
      LAB_PIPELINE: ${LAB_PIPELINE:-studio}
      LAB_IMAGE_TIER: fast
      LAB_WAN_TIER: 5b
      LAB_LTX_TIER: "2.5"
      LAB_VISUAL_ENABLE_NUNCHAKU: "0"
      # 1 = force-disable torch.backends.python_native.triton (CLIP still works via eager)
      # Entrypoint may also set this when Triton JIT deps are missing.
      LAB_DISABLE_TORCH_NATIVE_TRITON: ${LAB_DISABLE_TORCH_NATIVE_TRITON:-0}
      # Host media bind-mount (SaveImage / SaveVideo / VHS). Default /mnt/comfy-output.
      COMFY_OUTPUT_DIR: ${COMFY_OUTPUT_DIR:-/mnt/comfy-output}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_DIR:-/mnt/models}:/models
      - comfy-state:/comfy-state
      # Generated PNG/MP4 — host path, not the named volume
      - ${COMFY_OUTPUT_DIR:-/mnt/comfy-output}:/outputs
      # All example workflows (host tree); entrypoint copies into user workflows
      - ../workflows:/opt/ez-comfy/workflows:ro
      # In-tree custom nodes (prompt-enhance, LTX spatial snap); entrypoint copies packs
      - ../custom_nodes:/opt/ez-comfy/custom_nodes:ro
      # Host ops scripts — iterate without image rebuild (image still embeds for GHCR)
      - ./entrypoint.sh:/opt/ez-comfy/entrypoint.sh:ro
      - ./install-comfy.sh:/opt/ez-comfy/install-comfy.sh:ro
      - ./install-comfy:/opt/ez-comfy/install-comfy:ro
      - ./patch_get_free_memory.py:/opt/ez-comfy/patch_get_free_memory.py:ro
      - ./pythonpath:/opt/ez-comfy/pythonpath:ro
    gpus: all
    shm_size: "16gb"
    mem_limit: ${MEM_LIMIT:-90g}
    mem_reservation: ${MEM_RESERVATION:-80g}
    # cpus soft limit (compose v2)
    cpus: 12.0

volumes:
  comfy-state:
    name: ez-comfy-state
